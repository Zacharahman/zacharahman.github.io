    Experience:
      - company: Schaffer Lab, Icahn School of Medicine at Mount Sinai
        position: Visiting Research Scientist
        location: New York, NY
        start_date: 2026-05-01
        end_date: present
        summary: Gradient clipping, transfer, and task-feature learning in recurrent networks.
        highlights:
          - Studying how gradient clipping shapes nonconvex RNN training dynamics, with a focus on transfer and task-feature learning.
          - Characterizing how clipping thresholds and model parameters govern learned solutions and training complexity, toward understanding altered learning in neurological and psychiatric disorders.

      - company: Courant Institute of Mathematical Sciences, New York University
        position: Graduate Researcher, M.S. Thesis
        location: New York, NY
        start_date: 2025-09-01
        end_date: present
        summary: Dynamical systems models of PP1/PP2A regulation in LTP formation.
        highlights:
          - Developing phenomenological dynamical-systems models of PP1/PP2A regulation of CaMKII-dependent LTP formation; manuscript in preparation.
          - Performing numerical bifurcation analysis (continuation, Jacobian spectral analysis) in Python and TensorFlow across kinase, phosphatase, and calcium parameters.
          - Identified tristable regimes set by T286/T305 phosphorylation, and phosphatase thresholds governing calcium-driven LTP/LTD switching.

      - company: Courant Institute of Mathematical Sciences, New York University
        position: Teaching Assistant
        location: New York, NY
        start_date: 2025-09-01
        end_date: present
        highlights:
          - Lead recitations, hold office hours, and develop problem sets and review materials for Calculus I, Calculus II, and Linear Algebra.

      - company: Department of Mathematics, University of South Carolina
        position: Mathematics Research Assistant
        location: Columbia, SC
        start_date: 2024-05-01
        end_date: 2025-05-01
        summary: "Coarse-grained event tree analysis of GLIF neuronal networks (Advisor: Dr. Yi Sun)."
        highlights:
          - Built a Python event tree analysis (ETA) framework for GLIF networks to quantify network dynamics and input discriminability.
          - Used conditional probability distributions over event chains to measure sensitivity to small input perturbations.
          - Showed that synaptic conductance and Gaussian noise critically shape excitability thresholds.

      - company: Department of Mathematics, University of South Carolina
        position: Undergraduate Teaching Assistant
        location: Columbia, SC
        start_date: 2023-08-01
        end_date: 2025-05-01
