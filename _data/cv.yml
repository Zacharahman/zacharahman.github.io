        end_date: 2024-05-01
        summary: "GLIF modeling and simulation (Advisor: Dr. Yi Sun)."
        highlights:
          - Implemented a GLIF model bridging LIF and Hodgkin-Huxley dynamics for large-scale networks.
          - Built a simulation pipeline for neuronal responses under variable noise and synaptic coupling; supported by the UREP Grant and Magellan Fellowship.

